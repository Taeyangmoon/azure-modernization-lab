name: Validate lab tools

on:
  push:
    branches: [main]
    paths: ["scripts/**", "tools/**", "tests/**", ".github/workflows/validate.yml"]
  pull_request:
    paths: ["scripts/**", "tools/**", "tests/**", ".github/workflows/validate.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate shell syntax and run regression tests
        run: |
          bash -n scripts/env.sh
          python -m unittest discover -s tests -v
