name: Deploy to Azure Container Apps

# 실습 7에서 이 파일을 .github/workflows/deploy.yml 로 복사해서 사용합니다.
on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  id-token: write   # Azure 와 OIDC(비밀번호 없는) 로그인에 필요
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: inventory

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build image in ACR
        run: |
          az acr build \
            --registry "${{ vars.ACR_NAME }}" \
            --image "$IMAGE_NAME:${{ github.sha }}" \
            ./app

      - name: Deploy new revision
        run: |
          az containerapp update \
            --name "${{ vars.APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --image "${{ vars.ACR_NAME }}.azurecr.io/$IMAGE_NAME:${{ github.sha }}" \
            --set-env-vars APP_VERSION="${{ github.sha }}" \
            -o none

      - name: Verify deployed app
        run: |
          APP_FQDN=$(az containerapp show \
            --name "${{ vars.APP_NAME }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "https://$APP_FQDN"
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --max-time 15 "https://$APP_FQDN/health" |
              python3 -c 'import json, os, sys; body = json.load(sys.stdin); print(body); sys.exit(0 if body.get("status") == "ok" and body.get("version") == os.environ["GITHUB_SHA"] else 1)'; then
              exit 0
            fi
            echo "Deployment not healthy at the expected commit yet (attempt $attempt/24)" >&2
            sleep 5
          done
          echo "Deployed app did not become healthy at commit $GITHUB_SHA" >&2
          exit 1
